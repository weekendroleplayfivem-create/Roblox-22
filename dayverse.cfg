# ============================================================
#  Dayverse Roleplay (ESX) - dv-hud, dv-inventory, dv-admin, dv-reports, nijmegen-cinematics
#  Zet dit bestand naast je server.cfg en voeg in server.cfg toe:
#      exec dayverse.cfg
#  BELANGRIJK: zet die regel NA "ensure es_extended" en je andere ESX-scripts
#  (esx_status, esx_basicneeds, esx_ambulancejob, ...).
# ============================================================

# ---------- Resources ----------
ensure dv-hud
ensure dv-inventory
ensure dv-admin
ensure dv-reports
ensure nijmegen-cinematics

# Zet in server.cfg een andere HUD uit als je die hebt (bv. esx_hud).
# Gebruik je ox_inventory? Zet die dan uit: dv-inventory werkt met de standaard ESX-inventory.

# ---------- Staff ----------
# Staff werkt via je ESX-groep. Geef iemand een groep in de serverconsole of in-game:
#     setgroup <id> admin      (Admin)
#     setgroup <id> owner      (Eigenaar; bij oudere ESX: superadmin)
#     setgroup <id> mod        (Moderator)
# Welke groep welke rang is: Config.EsxGroups in dv-admin/config.lua en dv-reports/config.lua.
#
# Optioneel (i.p.v. of naast ESX-groepen): rechten via ACE
# add_ace group.admin dvadmin.admin allow
# add_ace group.admin dvadmin.mod   allow
# add_principal identifier.license:VERVANG_MIJ group.admin

# Cinematic maker: ESX-groepen admin/owner/superadmin hebben automatisch toegang.
# "Voor iedereen afspelen" alleen owner/superadmin (zie nijmegen-cinematics/config.lua).

