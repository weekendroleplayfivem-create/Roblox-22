# ============================================================
#  Dayverse Roleplay - dv-hud, dv-admin, dv-reports en dv-inventory
#  Zet dit bestand naast je server.cfg en voeg in server.cfg toe:
#      exec dayverse.cfg
#  (zet die regel NA je framework, bv. na "ensure qb-core" of "ensure es_extended")
# ============================================================

# ---------- Resources ----------
ensure dv-hud
ensure dv-inventory
ensure dv-admin
ensure dv-reports
ensure nijmegen-cinematics

# Let op: gebruik maar één inventory. Zet in server.cfg uit (# ervoor):
#   qb-inventory / ox_inventory / esx_inventoryhud

# ---------- Staff-rangen ----------
# 1 = moderator, 2 = admin, 3 = eigenaar (hogere rang krijgt alles van de lagere)
add_ace group.mod   dvadmin.mod   allow

add_ace group.admin dvadmin.admin allow
add_ace group.admin dvadmin.mod   allow

add_ace group.owner dvadmin.owner allow
add_ace group.owner dvadmin.admin allow
add_ace group.owner dvadmin.mod   allow

# Cinematic maker (Nijmegen Scripts): wie mag de editor gebruiken en voor iedereen afspelen
add_ace group.admin nijmegen.cinematics allow
add_ace group.owner nijmegen.cinematics allow
add_ace group.owner nijmegen.cinematics.broadcast allow

# ---------- Staffleden ----------
# Vervang de license door die van jouw staff (te vinden in txAdmin of in de serverconsole bij het joinen).
# Eén regel per persoon, kies group.owner, group.admin of group.mod.
add_principal identifier.license:VERVANG_MIJ group.owner
# add_principal identifier.license:VERVANG_MIJ group.admin
# add_principal identifier.license:VERVANG_MIJ group.mod

# ---------- Discord-logs (optioneel) ----------
# Haal het # weg en plak je webhook-URL. Reports gebruiken dvadmin_webhook als dvreports_webhook leeg is.
# set dvadmin_webhook   "https://discord.com/api/webhooks/..."
# set dvreports_webhook "https://discord.com/api/webhooks/..."
